[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/dire-kiwi/kiwi-nest"
publish = false

[workspace.dependencies]
kn-proto = { path = "crates/kn-proto" }
kn-bundle = { path = "crates/kn-bundle" }
kn-node = { path = "crates/kn-node" }
kn-btrfs = { path = "crates/kn-btrfs" }
kn-cli = { path = "crates/kn-cli" }
kn-server = { path = "crates/kn-server" }

anyhow = "1"
axum = "0.8"
bytes = "1"
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
http-body-util = "0.1"
humantime = "2"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
getrandom = "0.3"
# TLS through rustls with ring (installed as the process's provider), so the static musl builds need no C toolchain
# beyond what ring's own build uses.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls-no-provider"] }
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
